<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- || title -->
    <title>URLGegma</title>
    <meta name="twitter:title" content="URLGegma" />
    <meta property="og:title" content="URLGegma" />

    <!-- || description - around 150 characters -->
    <meta
      name="description"
      content="URLGegma web gym program creator and sharing platform. სავარჯიშო პროგრამის ონლაინ შემქმნელი. gym პროგრამები"
    />
    <meta
      name="twitter:description"
      content="URLGegma web gym program creator and sharing platform. სავარჯიშო პროგრამის ონლაინ შემქმნელი. gym პროგრამები"
    />
    <meta
      property="og:description"
      content="URLGegma web gym program creator and sharing platform. სავარჯიშო პროგრამის ონლაინ შემქმნელი. gym პროგრამები"
    />

    <!-- || static Facebook Open Graph tags -->
    <!-- make sure og:url content doesn't start with www -->
    <meta property="og:url" content="https://urlgegma.pages.dev/" />
    <meta property="og:site_name" content="urlgegma" />

    <!-- || og:image and twitter:image -->
    <!-- og:image should be 1200x630 px -->
    <!-- twitter:image can be any size. -->
    <!-- make sure og:image and twitter:image content doesn't start with www -->
    <meta
      property="og:image"
      content="https://urlgegma.pages.dev/og-image-1200x630.png"
    />
    <meta
      property="twitter:image"
      content="https://urlgegma.pages.dev/og-image-1200x630.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- || icons & webmanifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
